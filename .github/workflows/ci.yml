name: CI

# Manual only for now (out of CI minutes; macOS runners bill at 10x on private repos).
# Run `scripts/check.sh` locally before every commit. Restore push/pull_request triggers when minutes allow.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # scripts/check.sh selects the newest Xcode on the runner and fails if any product
    # doesn't link against that Xcode's macOS SDK. Unit tests need no Wine runtime.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchains
        run: ls -d /Applications/Xcode*.app
      - name: Build, test, verify SDK
        run: scripts/check.sh
