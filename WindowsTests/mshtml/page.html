<body>
<div id="menu"><!-- a comment before the first element --><span id="first"></span></div>
<div id="root"></div>
<script>
var menu = document.getElementById("menu");
var children = menu.children.length + ":" + (menu.children[0] && menu.children[0].tagName);
var apply;
try { apply = (function() { return arguments.length; }).apply(null, undefined); } catch (e) { apply = "threw"; }
var inlineRan = true;
window.onload = function() {
    document.title = "mode=" + document.documentMode + " children=" + children + " apply=" + apply + " defer=" + window.deferOk;
};
</script>
