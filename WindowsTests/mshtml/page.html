<!doctype html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=10">
<title>running</title>
<script defer src="deferred.js"></script>
</head>
<body>
<div id="menu"><!-- a comment before the first element --><span id="first"></span></div>
<div id="root"></div>
<script>
var menu = document.getElementById("menu");
var children = menu.children.length + ":" + (menu.children[0] && menu.children[0].tagName);
var apply;
try { apply = (function() { return arguments.length; }).apply(null, undefined); } catch (e) { apply = "threw"; }
var inlineRan = true;
window.onload = function() {
    var reduced, status, state;
    try { reduced = [1, 2, 3].reduceRight(function(a, b) { return a + "" + b; }); } catch (e) { reduced = "threw"; }
    try { var x = new XMLHttpRequest(); x.open("GET", "deferred.js"); status = x.status; } catch (e) { status = "threw"; }
    try { history.replaceState({ n: 1 }, "", "?x=1"); state = history.state.n + ":" + location.search; } catch (e) { state = "threw"; }
    document.title = "mode=" + document.documentMode + " children=" + children + " apply=" + apply + " defer=" + window.deferOk +
        " reduceRight=" + reduced + " status=" + status + " state=" + state + " end";
};
</script>
</body>
</html>
